<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>csvzall Viewer</title>
  <meta name="theme-color" content="#1f6f5b">
  <link rel="icon" href="./icon-192.png" sizes="192x192" type="image/png">
  <link rel="manifest" href="./manifest.webmanifest">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>csvzall Viewer</h1>
      <p id="status">Loading WASM module...</p>
    </div>
    <div class="actions">
      <a class="repo-link" href="https://github.com/vincentlaucsb/csvzall" target="_blank" rel="noopener noreferrer" aria-label="Open csvzall on GitHub" title="Open csvzall on GitHub">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 .5a12 12 0 0 0-3.8 23.39c.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.3 3.5.99.11-.77.42-1.3.76-1.6-2.67-.3-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.3-.54-1.52.12-3.18 0 0 1.01-.32 3.3 1.23A11.5 11.5 0 0 1 12 5.81c1.02 0 2.04.14 3 .41 2.29-1.55 3.3-1.23 3.3-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.63-5.49 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.69.83.57A12 12 0 0 0 12 .5Z"/>
        </svg>
      </a>
      <button id="install-app" type="button" hidden>Install app</button>
      <label class="file-picker">
        <span>Open CSV/TSV</span>
        <input id="file-input" type="file" accept=".csv,.tsv,text/csv,text/tab-separated-values">
      </label>
      <button id="insert-menu" class="menu-button" type="button" disabled>
        <span>Insert</span>
        <span class="dropdown-chevron" aria-hidden="true">v</span>
      </button>
      <button id="delete-menu" class="menu-button" type="button" disabled>
        <span>Delete</span>
        <span class="dropdown-chevron" aria-hidden="true">v</span>
      </button>
      <button id="reset" type="button" disabled>Reset</button>
      <button id="save" type="button" disabled>Download CSV</button>
    </div>
  </header>
  <main>
    <div id="grid" class="ag-theme-quartz-auto-dark"></div>
  </main>
  <footer>
    <span id="record-count"></span>
  </footer>
  <div id="drop-overlay" class="drop-overlay" role="status" aria-live="polite" aria-hidden="true" hidden>
    <div class="drop-overlay-content">
      <strong>Drop one .csv or .tsv file to open</strong>
      <span>Only files ending in .csv or .tsv are supported.</span>
    </div>
  </div>
  <dialog id="loading-dialog" aria-labelledby="loading-title" aria-describedby="loading-detail">
    <div class="loading-panel">
      <div class="spinner" aria-hidden="true"></div>
      <div>
        <h2 id="loading-title">Loading CSV Engine</h2>
        <p id="loading-detail">The parser is starting in a background worker.</p>
      </div>
    </div>
  </dialog>
  <dialog id="insert-column-dialog" class="csvzall-dialog">
    <form id="insert-column-form" class="dialog-form">
      <h2>Insert column</h2>
      <label>
        <span>Column name</span>
        <input id="insert-column-name" type="text" autocomplete="off" required>
      </label>
      <p id="insert-column-error" class="dialog-error" hidden></p>
      <div class="dialog-actions">
        <button id="cancel-insert-column" type="button">Cancel</button>
        <button type="submit">Insert</button>
      </div>
    </form>
  </dialog>
  <dialog id="rename-column-dialog" class="csvzall-dialog">
    <form id="rename-column-form" class="dialog-form">
      <h2>Rename column</h2>
      <label>
        <span>Column name</span>
        <input id="rename-column-name" type="text" autocomplete="off" required>
      </label>
      <p id="rename-column-error" class="dialog-error" hidden></p>
      <div class="dialog-actions">
        <button id="cancel-rename-column" type="button">Cancel</button>
        <button type="submit">Rename</button>
      </div>
    </form>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
