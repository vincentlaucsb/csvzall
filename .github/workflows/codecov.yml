name: Code Coverage

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  codecov:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Install coverage tools
        run: python3 -m pip install --user gcovr

      - name: Detect CMake toolchain cache key
        id: cmake-cache-key
        shell: pwsh
        run: |
          function Convert-CachePart($value) {
            $part = [string]$value
            if ([string]::IsNullOrWhiteSpace($part)) {
              return "unknown"
            }
            return ($part -replace '[^A-Za-z0-9_.-]+', '-').Trim('-')
          }

          $cmakeVersion = (cmake --version | Select-Object -First 1)
          $defaultGenerator = (cmake --help | Where-Object { $_ -match '^\* ' } | Select-Object -First 1)
          $defaultGenerator = $defaultGenerator -replace '^\*\s*', ''
          $defaultGenerator = ($defaultGenerator -split '\s+=\s+', 2)[0].Trim()

          if ($env:RUNNER_OS -eq 'Windows') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $toolchain = if (Test-Path $vswhere) { & $vswhere -latest -property installationVersion } else { $env:VisualStudioVersion }
            $toolchain = "vs-$toolchain"
          } else {
            $compiler = if ($env:CXX) { $env:CXX } else { "c++" }
            $toolchain = (& $compiler --version | Select-Object -First 1)
          }

          $id = @(
            Convert-CachePart $cmakeVersion
            Convert-CachePart $defaultGenerator
            Convert-CachePart $toolchain
          ) -join '-'
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Cache CMake dependencies
        uses: actions/cache@v5.0.5
        with:
          path: out/fetchcontent
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-

      - name: Configure CMake
        run: >
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCSVZALL_CXX_STANDARD=23
          -DCSVZALL_ENABLE_POSTGRESQL=OFF
          -DCSVZALL_ENABLE_KEYCHAIN=OFF
          -DCSVZALL_PREFER_SIBLING_CSV_PARSER=OFF
          -DCMAKE_CXX_FLAGS_DEBUG="--coverage -O0 -g"
          -DCMAKE_C_FLAGS_DEBUG="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS_DEBUG="--coverage"

      - name: Build
        run: cmake --build build-coverage --config Debug

      - name: Test
        run: ctest --test-dir build-coverage -C Debug --output-on-failure

      - name: Generate coverage report
        run: >
          python3 -m gcovr
          --root .
          --filter 'src/.*'
          --exclude 'external/.*'
          --exclude 'build-coverage/.*'
          --exclude-unreachable-branches
          --exclude-throw-branches
          --xml-pretty
          --output coverage.xml
          build-coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6.0.1
        with:
          files: coverage.xml
          fail_ci_if_error: false
          slug: vincentlaucsb/csvzall
          token: ${{ secrets.CODECOV_TOKEN }}
