name: Build & Test csvzall

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: true

      - name: Detect CMake toolchain cache key
        id: cmake-cache-key
        shell: pwsh
        run: |
          function Convert-CachePart($value) {
            $part = [string]$value
            if ([string]::IsNullOrWhiteSpace($part)) {
              return "unknown"
            }
            return ($part -replace '[^A-Za-z0-9_.-]+', '-').Trim('-')
          }

          $cmakeVersion = (cmake --version | Select-Object -First 1)
          $defaultGenerator = (cmake --help | Where-Object { $_ -match '^\* ' } | Select-Object -First 1)
          $defaultGenerator = $defaultGenerator -replace '^\*\s*', ''
          $defaultGenerator = ($defaultGenerator -split '\s+=\s+', 2)[0].Trim()

          if ($env:RUNNER_OS -eq 'Windows') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $toolchain = if (Test-Path $vswhere) { & $vswhere -latest -property installationVersion } else { $env:VisualStudioVersion }
            $toolchain = "vs-$toolchain"
          } else {
            $compiler = if ($env:CXX) { $env:CXX } else { "c++" }
            $toolchain = (& $compiler --version | Select-Object -First 1)
          }

          $id = @(
            Convert-CachePart $cmakeVersion
            Convert-CachePart $defaultGenerator
            Convert-CachePart $toolchain
          ) -join '-'
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Cache CMake dependencies
        uses: actions/cache@v5.0.5
        with:
          path: out/fetchcontent
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel --target csvzall csvzall_tests

      - name: Test
        working-directory: build
        run: ctest -C Release --output-on-failure

  wasm-viewer:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.0

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build WASM target
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B out/build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build out/build/wasm --target csvzall_viewer_wasm --parallel

      - name: Build web app
        working-directory: src/viewer_wasm/web
        run: |
          npm install
          npm test
          npm run build

      - name: Stage release artifact
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
          node scripts/package_wasm_viewer.mjs --source-ref "$ref_name" --out-dir dist/csvzall-wasm-viewer
