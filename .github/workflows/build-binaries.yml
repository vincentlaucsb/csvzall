name: Build Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            archive-extension: tar.gz

          - os: windows-latest
            platform: windows
            archive-extension: zip

          - os: macos-latest
            platform: macos
            archive-extension: tar.gz

    runs-on: ${{ matrix.os }}
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@v4.3.3

      - name: Install PostgreSQL client libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "PostgreSQL_ROOT=$(brew --prefix libpq)" >> "$GITHUB_ENV"

      - name: Detect CMake toolchain cache key
        id: cmake-cache-key
        shell: pwsh
        run: |
          function Convert-CachePart($value) {
            $part = [string]$value
            if ([string]::IsNullOrWhiteSpace($part)) {
              return "unknown"
            }
            return ($part -replace '[^A-Za-z0-9_.-]+', '-').Trim('-')
          }

          $cmakeVersion = (cmake --version | Select-Object -First 1)
          $defaultGenerator = (cmake --help | Where-Object { $_ -match '^\* ' } | Select-Object -First 1)
          $defaultGenerator = $defaultGenerator -replace '^\*\s*', ''
          $defaultGenerator = ($defaultGenerator -split '\s+=\s+', 2)[0].Trim()

          if ($env:RUNNER_OS -eq 'Windows') {
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
            $toolchain = if (Test-Path $vswhere) { & $vswhere -latest -property installationVersion } else { $env:VisualStudioVersion }
            $toolchain = "vs-$toolchain"
          } else {
            $compiler = if ($env:CXX) { $env:CXX } else { "c++" }
            $toolchain = (& $compiler --version | Select-Object -First 1)
          }

          $id = @(
            Convert-CachePart $cmakeVersion
            Convert-CachePart $defaultGenerator
            Convert-CachePart $toolchain
          ) -join '-'
          "id=$id" >> $env:GITHUB_OUTPUT

      - name: Cache CMake dependencies
        uses: actions/cache@v5.0.5
        with:
          path: out/fetchcontent
          key: ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-${{ hashFiles('CMakeLists.txt', 'cmake/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-cmake-fetchcontent-${{ steps.cmake-cache-key.outputs.id }}-

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSVZALL_CXX_STANDARD=23 -DCSVZALL_REQUIRE_POSTGRESQL=ON -DPostgreSQL_ROOT="$PostgreSQL_ROOT"

      - name: Configure CMake
        if: runner.os != 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSVZALL_CXX_STANDARD=23 -DCSVZALL_REQUIRE_POSTGRESQL=ON

      - name: Build
        run: cmake --build build --config Release --parallel --target csvzall

      - name: Package release binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $packageDir = "dist/package"
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          $candidates = @(
            "build/csvzall.exe",
            "build/Release/csvzall.exe",
            "build/RelWithDebInfo/csvzall.exe"
          )
          $binary = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $binary) {
            throw "csvzall.exe was not found in the build output."
          }
          Copy-Item -LiteralPath $binary -Destination "$packageDir/csvzall.exe"

          $runtimeFiles = @(
            "build/*.dll",
            "build/Release/*.dll",
            "build/RelWithDebInfo/*.dll"
          )
          foreach ($pattern in $runtimeFiles) {
            Get-ChildItem -Path $pattern -ErrorAction SilentlyContinue |
              Copy-Item -Destination $packageDir -Force
          }

          $safeTag = $env:RELEASE_TAG -replace '[\\/]', '-'
          $arch = [string]$env:RUNNER_ARCH
          $arch = $arch.ToLowerInvariant()
          $assetPath = "dist/csvzall-$safeTag-${{ matrix.platform }}-$arch.${{ matrix.archive-extension }}"
          Compress-Archive -Path "$packageDir/*" -DestinationPath $assetPath -Force
          "ASSET_PATH=$assetPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Package release binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          package_dir="dist/package"
          mkdir -p "$package_dir"

          if [[ ! -f build/csvzall ]]; then
            echo "csvzall was not found in the build output." >&2
            exit 1
          fi
          cp build/csvzall "$package_dir/csvzall"
          chmod +x "$package_dir/csvzall"

          find build -maxdepth 2 -type f \( -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) \
            -exec cp {} "$package_dir/" \;

          safe_tag="${RELEASE_TAG//\//-}"
          arch="$(printf '%s' "$RUNNER_ARCH" | tr '[:upper:]' '[:lower:]')"
          asset_path="dist/csvzall-${safe_tag}-${{ matrix.platform }}-${arch}.${{ matrix.archive-extension }}"
          tar -czf "$asset_path" -C "$package_dir" .
          echo "ASSET_PATH=$asset_path" >> "$GITHUB_ENV"

      - name: Attach binary to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$ASSET_PATH" --clobber

  wasm-viewer:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.0
      RELEASE_TAG: ${{ github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          ref: ${{ github.event.release.tag_name }}
          submodules: recursive

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build WASM target
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B out/build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build out/build/wasm --target csvzall_viewer_wasm --parallel

      - name: Build web app
        working-directory: src/viewer_wasm/web
        run: |
          npm install
          npm run build

      - name: Package WASM viewer release asset
        shell: bash
        run: |
          set -euo pipefail
          safe_tag="${RELEASE_TAG//\//-}"
          package_dir="dist/csvzall-wasm-viewer-${safe_tag}"
          asset_path="dist/csvzall-wasm-viewer-${safe_tag}.zip"
          source_commit="$(git rev-list -n 1 "$RELEASE_TAG")"

          node scripts/package_wasm_viewer.mjs \
            --version "$RELEASE_TAG" \
            --source-ref "$RELEASE_TAG" \
            --source-commit "$source_commit" \
            --out-dir "$package_dir"

          (cd "$package_dir" && zip -r "../csvzall-wasm-viewer-${safe_tag}.zip" .)
          sha256sum "$asset_path" > "${asset_path}.sha256"

          echo "WASM_VIEWER_ASSET_PATH=$asset_path" >> "$GITHUB_ENV"
          echo "WASM_VIEWER_CHECKSUM_PATH=${asset_path}.sha256" >> "$GITHUB_ENV"

      - name: Attach WASM viewer to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" "$WASM_VIEWER_ASSET_PATH" "$WASM_VIEWER_CHECKSUM_PATH" --clobber
