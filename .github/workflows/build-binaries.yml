name: Build Binaries (on every push to master)

on:
  push:
    branches: [ master ]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            artifact: csvzall-linux-x86_64

          - os: windows-latest
            name: windows-x64
            artifact: csvzall-windows-x64.exe

          - os: macos-latest
            name: macos-x86_64
            artifact: csvzall-macos-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Install PostgreSQL client libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libpq
          echo "PostgreSQL_ROOT=$(brew --prefix libpq)" >> "$GITHUB_ENV"

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSVZALL_CXX_STANDARD=23 -DCSVZALL_REQUIRE_POSTGRESQL=ON -DPostgreSQL_ROOT="$PostgreSQL_ROOT"

      - name: Configure CMake
        if: runner.os != 'macOS'
        run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCSVZALL_CXX_STANDARD=23 -DCSVZALL_REQUIRE_POSTGRESQL=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/csvzall
            build/csvzall.exe
            build/*.dll
            build/Release/csvzall.exe
            build/Release/*.dll
            build/RelWithDebInfo/csvzall.exe
            build/RelWithDebInfo/*.dll
          if-no-files-found: error
