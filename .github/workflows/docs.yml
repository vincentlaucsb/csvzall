name: Publish API Docs

on:
  push:
    branches: [ main, master ]
    paths:
      - CMakeLists.txt
      - Doxyfile
      - README.md
      - cmake/**
      - src/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: 6.0.0

    steps:
      - uses: actions/checkout@v6.0.2
        with:
          submodules: recursive

      - name: Install documentation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Generate Doxygen documentation
        run: |
          doxygen Doxyfile

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build WASM target
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B out/build/wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build out/build/wasm --target csvzall_viewer_wasm --parallel

      - name: Build viewer web app
        working-directory: src/viewer_wasm/web
        run: |
          npm install
          npm run build

      - name: Compose GitHub Pages site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/pages/viewer
          cp -a docs/doxygen/html/. dist/pages/
          cp -a src/viewer_wasm/web/dist/. dist/pages/viewer/
          touch dist/pages/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
